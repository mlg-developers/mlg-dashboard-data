server {
    listen 80;
    server_name ${FRONTEND_SERVER_NAME};

    client_max_body_size 10m;

    # TV displays: the app uses hash routing, so a plain /tv (or /tv/clinics, /tv/doctors, /tv/control, with or
    # without ?floor=...) is redirected to the same page behind the hash, e.g. /tv?floor=001 -> /#/tv?floor=001.
    # (relative redirect, so the browser keeps whatever host and port it used to reach the site)
    location = /tv {
        absolute_redirect off;
        return 302 /#$request_uri;
    }
    location ^~ /tv/ {
        absolute_redirect off;
        return 302 /#$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static assets — served directly with long cache and correct range-request support.
    # gzip_static off prevents compressed-vs-range conflicts that cause 206 ERR_CONNECTION_RESET.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;
        gzip_static off;
        try_files $uri =404;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 180s;
    }

    location /storage/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
